# ☠ Bloodbath
# /bloodbath reload applies changes without a restart.
# Times are in seconds, damage and health in half-hearts (20 = a full health bar).

resource-pack:
  # Send players the resource pack with the 3D models. Players who decline it (or can't
  # download it) still get working weapons; they just look like netherite swords.
  enabled: true

  # embedded: the plugin hosts the pack itself on the port below. Works out of the box on a home
  #           server or VPS as long as that port is reachable (open it in your firewall/router).
  # url:      send a pack you host yourself. The plugin exports the pack to
  #           plugins/Bloodbath/Bloodbath-ResourcePack.zip; upload it anywhere that gives a direct
  #           download link (or merge it into your server's own pack) and put the link in url.
  mode: embedded

  # embedded mode
  port: 8163
  bind: 0.0.0.0
  # The address players download the pack from. Leave blank to use whatever address each player
  # typed to join, which is right unless you're behind BungeeCord/Velocity/TCPShield. Can be a host
  # name ("mc.example.com"), host:port, or a full base URL for a reverse proxy
  # ("https://example.com/packs").
  public-host: ''

  # url mode
  url: ''
  # SHA-1 of the file at url, so clients can cache it. Blank = the plugin downloads it once at
  # startup to work it out.
  sha1: ''

  # Kick players who decline the pack. Only turn this on if the download works for everyone.
  required: false
  # Shown on the download prompt. MiniMessage format.
  prompt: '<dark_red><bold>Bloodbath</bold></dark_red> <gray>uses a resource pack for its 3D weapons.'

items:
  # The blood-red tooltip frame on weapons. It comes from the resource pack, and players without
  # the pack would see a purple-and-black missing texture instead, so:
  # auto = only when resource-pack.required is true, true = always, false = never.
  tooltip-frame: auto

hud:
  # The action-bar line while holding a weapon (cooldown bar, rift timer, bleed stacks, ...).
  # Players can hide it for themselves with /bloodbath hud.
  enabled: true
  # The bell and blood ring when an ability comes off cooldown.
  ready-ping: true
  # A soft tick when an ability hit lands, and a ☠ under the crosshair when a weapon kills.
  hit-markers: true

effects:
  # Scales every particle count. 0.5 halves them for weaker PCs, 0 turns them off.
  particle-multiplier: 1.0
  # Players further than this (blocks) from an effect aren't sent it at all. Up to
  # full-detail-distance they see every particle, up to twice that half, beyond that a quarter.
  view-distance: 64
  full-detail-distance: 24
  # Custom sprites (blood nova impacts), HUD icons and the armory's artwork for players who
  # loaded the resource pack. Everyone else always gets the vanilla-safe version.
  pack-visuals: true
  # Blood dripping from a held weapon.
  held-aura: true
  # Gore burst and blood streams into the killer when a weapon kills.
  kill-effects: true
  # The screen edges run red while Blood Rage lasts.
  rage-vignette: true

gameplay:
  # Worlds where abilities don't work (the weapons still hit like weapons).
  disabled-worlds: []
  # Abilities can't hurt, pull or launch players in worlds with PvP off.
  respect-world-pvp: true
  # Dropped weapons never despawn and survive cactus and explosions.
  weapons-never-despawn: true

kill-tracking:
  # Weapons count their kills and rank up: Blooded 5, Crimson 25, Sanguine 100, Bloodbath 250.
  enabled: true
  # Count mob kills too, not just players.
  count-mobs: true

messages:
  prefix: '<dark_red>☠</dark_red> '

# Per-weapon switches and numbers. enabled: false hides a weapon from the armory, /bloodbath give
# and recipes, and turns off its powers (existing copies still work as plain weapons).
weapons:
  riftblade:            # Bloodrift Blade
    enabled: true
    cooldown: 15
    range: 14           # how far ahead the rift opens
    pull-radius: 3.5
    window: 6           # time to step through
  bloodhook:
    enabled: true
    cooldown: 6
    range: 10
    range-per-hook: 3   # extra range for hooking the same target again within 12s
    max-range: 28
  nullblade:            # Clotblade
    enabled: true
    cooldown: 20
    hit-clot: 4         # how long a hit suppresses a player's abilities
    field-radius: 4
    field-duration: 8
  meteor_gauntlet:      # Blood Meteor Gauntlet
    enabled: true
    cooldown: 14
    range: 24
    damage: 5
    radius: 4.5
    delay: 2
  gravestone:           # Crimson Gravestone
    enabled: true
    cooldown: 20
    radius: 6
    duration: 3
  chronos:              # Bleeding Chronos
    enabled: true
    cooldown: 18
    window: 8           # time to recall
  thunder_pike:         # Crimson Thunder Pike
    enabled: true
    cooldown: 12
    range: 22
    damage: 5
    radius: 3
  mirrorfang:           # Blood Mirrorfang
    enabled: true
    cooldown: 20
    duration: 7
    damage: 4           # per slash, every half second
    range: 3.5
  void_scythe:          # Hemorrhage Scythe
    enabled: true
    cooldown: 3         # Harvest (right-click)
    bleed-hits: 5       # hits to hemorrhage
    bleed-damage: 0.5   # per bleed stack, every bleed-interval (bleeding ignores armour)
    bleed-interval: 1.5
    damage: 10          # hemorrhage damage to the target
    splash-damage: 8    # ...and to everything around it
    radius: 4
    reap-damage: 4      # Harvest damage
  paradox_bow:          # Sanguine Paradox Bow
    enabled: true
    cooldown: 10
    damage: 7           # the echo's damage, on top of the arrow
    echo-delay: 1.5     # how long the echo takes to come back
    range: 40           # how far the echo will chase a marked creature
  vampire_fang:
    enabled: true
    cooldown: 8
    lifesteal: 0.25     # share of melee damage healed
    dash-speed: 1.7
    dash-damage: 4
  blood_grimoire:
    enabled: true
    cooldown: 14
    range: 12
    drain: 6            # health drained over 1.5s
    gift-cost: 4        # health you pay to give (never takes you below 1 heart)
    gift-heal: 8
    gift-regeneration: 4

# The Blood Knight's armour (helm, cuirass, greaves, sabatons). Netherite protection plus a heart
# of health per piece. Without the resource pack it looks like netherite in the inventory but is
# invisible when worn, so keep that in mind if the pack is optional on your server.
armor:
  enabled: true
  # (2 pieces) Bloodlust: health every kill gives back.
  kill-heal: 3
  # (3 pieces) Barbed Blood: damage melee attackers take back.
  barb-damage: 2
  # (4 pieces) Effects the full set gives for as long as it's worn, as effect:amplifier
  # (0 = level I). They go the moment a piece comes off. [] for none.
  full-set-effects: [strength:0, speed:0, fire_resistance:0]
  # (4 pieces) Blood Rage: when a hit leaves you at this share of your max health or less, you get
  # Strength and Resistance and a blood shockwave hurls everything nearby away.
  rage-threshold: 0.4
  rage-duration: 8
  rage-radius: 4
  rage-cooldown: 60

# The Blood Knight: a boss fight built from the boss model, with telegraphed attacks and a
# bloodied second phase. Summon it by sneaking and right-clicking crying obsidian with a Blood
# Core (the ritual), or with /bloodbath boss summon. It drops Blood Cores.
# Players with the resource pack see the animated model; everyone else sees its netherite armour
# fighting with nobody inside.
boss:
  enabled: true
  summon-ritual: true
  health: 600
  armor: 12
  melee-damage: 9         # its ordinary sword hits
  scale: 1.0              # model size (1 = about 3 blocks tall)
  arena-radius: 32        # it fights (and is leashed) within this of where it rose
  max-active: 1           # Blood Knights (and summonings) at once, server-wide
  warning-seconds: 6      # the omens before it rises
  leave-timeout: 60       # seconds with nobody left in the arena before it sinks back down
  phase-two-at: 0.5       # health share at which it's bloodied: faster, harder hitting
  animation-interval: 2   # ticks between model updates: 1 smoothest, 3 lightest on bandwidth
  atmosphere: true        # blood mist around players in the arena while it fights
  announce: true          # tell nearby players when it falls
  attacks:
    cooldown: 3.5         # seconds between special attacks (bloodied: 30% less)
    cleave-damage: 12     # a wide arc in front of it: get out of the arc
    slam-damage: 10       # a shockwave along the ground: jump over it
    spike-damage: 9       # eruptions under up to 3 players: step off the ring
    charge-damage: 8      # a shield charge along a telegraphed line: sidestep it
  loot:
    cores-min: 2
    cores-max: 4
    armor-chance: 0.35    # chance of one Blood Knight armour piece
    experience: 500

# Every Bloodbath sound can be made quieter, swapped or muted.
sounds:
  volume: 1.0
  # Swap a sound for another (or '' to mute it), by Minecraft sound id. For example:
  # replace:
  #   'entity.warden.sonic_boom': 'entity.generic.explode'
  #   'block.bell.use': ''
  replace: {}

# Crafting recipes. Every weapon and armour piece needs a Blood Core (BLOOD_CORE below), which
# the Blood Knight drops and which can be crafted from a nether star. Bloodbath items themselves
# can never be used as ingredients, and a Blood Core only works in these recipes.
recipes:
  enabled: true
  blood_core:
    shape: ['RTR', 'TNT', 'RTR']
    ingredients: {R: REDSTONE_BLOCK, T: GHAST_TEAR, N: NETHER_STAR}
  riftblade:
    shape: [' E ', 'RSR', 'PCP']
    ingredients: {E: ENDER_EYE, R: REDSTONE_BLOCK, S: NETHERITE_SWORD, P: ENDER_PEARL, C: BLOOD_CORE}
  bloodhook:
    shape: [' H ', 'RNR', 'LCL']
    ingredients: {H: TRIPWIRE_HOOK, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, L: LEAD, C: BLOOD_CORE}
  nullblade:
    shape: [' W ', 'RSR', 'FCF']
    ingredients: {W: WITHER_ROSE, R: REDSTONE_BLOCK, S: NETHERITE_SWORD, F: FERMENTED_SPIDER_EYE, C: BLOOD_CORE}
  meteor_gauntlet:
    shape: [' M ', 'RNR', 'FCF']
    ingredients: {M: MAGMA_BLOCK, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, F: FIRE_CHARGE, C: BLOOD_CORE}
  gravestone:
    shape: [' O ', 'RNR', 'DCD']
    ingredients: {O: CRYING_OBSIDIAN, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, D: SOUL_SAND, C: BLOOD_CORE}
  chronos:
    shape: [' K ', 'RNR', 'ECE']
    ingredients: {K: CLOCK, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, E: ECHO_SHARD, C: BLOOD_CORE}
  thunder_pike:
    shape: [' L ', 'RNR', 'BCB']
    ingredients: {L: LIGHTNING_ROD, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, B: BLAZE_ROD, C: BLOOD_CORE}
  mirrorfang:
    shape: [' G ', 'RNR', 'ACA']
    ingredients: {G: TINTED_GLASS, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, A: AMETHYST_SHARD, C: BLOOD_CORE}
  void_scythe:
    shape: [' W ', 'RSR', 'BCB']
    ingredients: {W: WITHER_SKELETON_SKULL, R: REDSTONE_BLOCK, S: NETHERITE_SWORD, B: BONE_BLOCK, C: BLOOD_CORE}
  paradox_bow:
    shape: [' E ', 'RBR', 'NCN']
    ingredients: {E: ECHO_SHARD, R: REDSTONE_BLOCK, B: BOW, N: NETHERITE_INGOT, C: BLOOD_CORE}
  vampire_fang:
    shape: [' T ', 'RSR', 'ACA']
    ingredients: {T: GHAST_TEAR, R: REDSTONE_BLOCK, S: NETHERITE_SWORD, A: GOLDEN_APPLE, C: BLOOD_CORE}
  blood_grimoire:
    shape: [' N ', 'RBR', 'TCT']
    ingredients: {N: NETHERITE_INGOT, R: REDSTONE_BLOCK, B: BOOK, T: TOTEM_OF_UNDYING, C: BLOOD_CORE}
  blood_knight_helm:
    shape: [' W ', 'RHR', ' C ']
    ingredients: {W: WITHER_SKELETON_SKULL, R: REDSTONE_BLOCK, H: NETHERITE_HELMET, C: BLOOD_CORE}
  blood_knight_cuirass:
    shape: [' O ', 'RAR', ' C ']
    ingredients: {O: CRYING_OBSIDIAN, R: REDSTONE_BLOCK, A: NETHERITE_CHESTPLATE, C: BLOOD_CORE}
