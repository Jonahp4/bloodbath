# ☠ Bloodbath
# /bloodbath reload applies changes without a restart.
# Times are in seconds, damage and health in half-hearts (20 = a full health bar).

resource-pack:
  # Send players the resource pack with the 3D models. Players who decline it (or can't
  # download it) still get working weapons; they just look like netherite swords.
  enabled: true

  # auto:     players download the pack from a public mirror (below), checked at startup to be
  #           byte-for-byte the pack inside this plugin, and from the plugin's own little web
  #           server when there's no mirror. No ports to open. If a player's download fails from
  #           one, they're sent the other straight away.
  # embedded: the plugin's own web server first (needs the port below open to the internet: in
  #           your firewall/router, or as an extra port on your host's panel), the mirror if a
  #           player can't reach it.
  # url:      send a pack you host yourself. The plugin exports the pack to
  #           plugins/Bloodbath/Bloodbath-ResourcePack.zip; upload it anywhere that gives a direct
  #           download link (or merge it into your server's own pack) and put the link in url.
  mode: auto

  # auto and embedded modes: public copies of the pack. {sha1} is the pack's hash and {version} the
  # plugin's version. A mirror is only used after the plugin has downloaded it and checked it's
  # identical to its own pack, so it can never hand players a different or outdated one. Remove them
  # all to never use a mirror.
  mirrors:
    - 'https://raw.githubusercontent.com/Jonahp4/bloodbath/HEAD/dist/pack/{sha1}.zip'
    - 'https://raw.githubusercontent.com/Jonahp4/bloodbath/claude/optimistic-shannon-gbw44d/dist/pack/{sha1}.zip'
    - 'https://cdn.jsdelivr.net/gh/Jonahp4/bloodbath/dist/pack/{sha1}.zip'

  # The plugin's own web server (auto and embedded modes)
  port: 8163
  bind: 0.0.0.0
  # The address players download the pack from. Leave blank to use whatever address each player
  # typed to join, which is right unless you're behind BungeeCord/Velocity/TCPShield. Can be a host
  # name ("mc.example.com"), host:port, or a full base URL for a reverse proxy
  # ("https://example.com/packs").
  public-host: ''

  # url mode
  url: ''
  # SHA-1 of the file at url, so clients can cache it. Blank = the plugin downloads it once at
  # startup to work it out.
  sha1: ''

  # Kick players who decline the pack. Only turn this on if the download works for everyone.
  required: false
  # Shown on the download prompt. MiniMessage format.
  prompt: '<dark_red><bold>Bloodbath</bold></dark_red> <gray>uses a resource pack for its 3D weapons.'

items:
  # The blood-red tooltip frame on weapons and armour. It comes from the resource pack; players who
  # decline the pack see a purple-and-black missing texture there instead.
  # auto = whenever the plugin sends the pack (or pack-visuals is always), true = always,
  # false = never.
  tooltip-frame: auto
  # Weapons and armour have their own item ids (unchartedsmp:riftblade, ...) instead of borrowing
  # netherite's, so another resource pack that retextures netherite can't hide them, and the Blood
  # Knight Helm is a real 3D helm on your head. Players without the pack see a missing-texture cube
  # instead of a netherite item, so set this to false if many of your players go without the pack.
  custom-ids: true

hud:
  # The action-bar line while holding a weapon (cooldown bar, rift timer, bleed stacks, ...).
  # Players can hide it for themselves with /bloodbath hud.
  enabled: true
  # The bell and blood ring when an ability comes off cooldown.
  ready-ping: true
  # A soft tick when an ability hit lands, and a ☠ under the crosshair when a weapon kills.
  hit-markers: true

effects:
  # Scales every particle count. 0.5 halves them for weaker PCs, 0 turns them off.
  particle-multiplier: 1.0
  # Players further than this (blocks) from an effect aren't sent it at all. Up to
  # full-detail-distance they see every particle, up to twice that half, beyond that a quarter.
  view-distance: 64
  full-detail-distance: 24
  # The pack-only visuals: custom blood particles, the animated boss model, HUD icons and the
  # armory's artwork. Players without the pack get vanilla-safe versions instead.
  # auto   = players whose game reported loading the pack (Bloodbath's own, or the server's pack
  #          from server.properties when resource-pack.enabled is false because you merged it)
  # always = everyone (the pack is forced some other way, or installed on every client by hand)
  # off    = nobody
  pack-visuals: auto
  # Blood dripping from a held weapon.
  held-aura: true
  # Gore burst and blood streams into the killer when a weapon kills.
  kill-effects: true
  # The screen edges run red while Blood Rage lasts.
  rage-vignette: true

gameplay:
  # Worlds where abilities don't work (the weapons still hit like weapons).
  disabled-worlds: []
  # Abilities can't hurt, pull or launch players in worlds with PvP off.
  respect-world-pvp: true
  # Dropped weapons never despawn and survive cactus and explosions.
  weapons-never-despawn: true

kill-tracking:
  # Weapons count their kills and rank up: Blooded 5, Crimson 25, Sanguine 100, Bloodbath 250.
  enabled: true
  # Count mob kills too, not just players.
  count-mobs: true

messages:
  prefix: '<dark_red>☠</dark_red> '

# Per-weapon switches and numbers. enabled: false hides a weapon from the armory, /bloodbath give
# and recipes, and turns off its powers (existing copies still work as plain weapons).
weapons:
  riftblade:            # Bloodrift Blade
    enabled: true
    cooldown: 15
    range: 14           # how far ahead the rift opens
    pull-radius: 3.5
    window: 6           # time to step through
  bloodhook:
    enabled: true
    cooldown: 6
    range: 10
    range-per-hook: 3   # extra range for hooking the same target again within 12s
    max-range: 28
  nullblade:            # Clotblade
    enabled: true
    cooldown: 20
    hit-clot: 4         # how long a hit suppresses a player's abilities
    field-radius: 4
    field-duration: 8
  meteor_gauntlet:      # Blood Meteor Gauntlet
    enabled: true
    cooldown: 14
    range: 24
    damage: 5
    radius: 4.5
    delay: 2
  gravestone:           # Crimson Gravestone
    enabled: true
    cooldown: 20
    radius: 6
    duration: 3
  chronos:              # Bleeding Chronos
    enabled: true
    cooldown: 18
    window: 8           # time to recall
  thunder_pike:         # Crimson Thunder Pike
    enabled: true
    cooldown: 12
    range: 22
    damage: 5
    radius: 3
  mirrorfang:           # Blood Mirrorfang
    enabled: true
    cooldown: 20
    duration: 7
    damage: 4           # per slash, every half second
    range: 3.5
  void_scythe:          # Hemorrhage Scythe
    enabled: true
    cooldown: 3         # Harvest (right-click)
    bleed-hits: 5       # hits to hemorrhage
    bleed-damage: 0.5   # per bleed stack, every bleed-interval (bleeding ignores armour)
    bleed-interval: 1.5
    damage: 10          # hemorrhage damage to the target
    splash-damage: 8    # ...and to everything around it
    radius: 4
    reap-damage: 4      # Harvest damage
  paradox_bow:          # Sanguine Paradox Bow
    enabled: true
    cooldown: 10
    damage: 7           # the echo's damage, on top of the arrow
    echo-delay: 1.5     # how long the echo takes to come back
    range: 40           # how far the echo will chase a marked creature
  vampire_fang:
    enabled: true
    cooldown: 8
    lifesteal: 0.25     # share of melee damage healed
    dash-speed: 1.7
    dash-damage: 4
  blood_grimoire:
    enabled: true
    cooldown: 14
    range: 12
    drain: 6            # health drained over 1.5s
    gift-cost: 4        # health you pay to give (never takes you below 1 heart)
    gift-heal: 8
    gift-regeneration: 4

# The Blood Knight's armour (helm, cuirass, greaves, sabatons). Netherite protection plus a heart
# of health per piece. Without the resource pack it looks like netherite in the inventory but is
# invisible when worn, so keep that in mind if the pack is optional on your server.
armor:
  enabled: true
  # (2 pieces) Bloodlust: health every kill gives back.
  kill-heal: 3
  # (3 pieces) Barbed Blood: damage melee attackers take back.
  barb-damage: 2
  # (4 pieces) Effects the full set gives for as long as it's worn, as effect:amplifier
  # (0 = level I). They go the moment a piece comes off. [] for none.
  full-set-effects: [strength:0, speed:0, fire_resistance:0]
  # (4 pieces) Blood Rage: when a hit leaves you at this share of your max health or less, you get
  # Strength and Resistance and a blood shockwave hurls everything nearby away.
  rage-threshold: 0.4
  rage-duration: 8
  rage-radius: 4
  rage-cooldown: 60

# The Blood Knight: a boss fight built from the boss model, with telegraphed attacks and a
# bloodied second phase. Summon it by sneaking and right-clicking crying obsidian with a Blood
# Core (the ritual), or with /bloodbath boss summon. It drops Blood Cores.
# Players with the resource pack see the animated model; everyone else sees its netherite armour
# fighting with nobody inside.
boss:
  enabled: true
  summon-ritual: true
  health: 2000
  health-per-extra-player: 0.6  # +60% health for each extra player in the arena when it rises
  armor: 20
  armor-toughness: 12
  melee-damage: 18        # its ordinary sword hits (each leaves bleed stacks, below)
  scale: 1.0              # model size (1 = about 3 blocks tall, a 2.4-block-wide body)
  arena-radius: 32        # it fights (and is leashed) within this of where it rose
  max-active: 1           # Blood Knights (and summonings) at once, server-wide
  warning-seconds: 6      # the omens before it rises
  leave-timeout: 60       # seconds with nobody left in the arena before it sinks back down
  phase-two-at: 0.6       # health share at which it's bloodied: faster, harder hitting, Blood Rain
  phase-three-at: 0.25    # its last stand: thralls, Whirlwind, lifesteal
  damage-cap: 40          # the most any single hit can take off it (0 = no cap): no one-shots
  projectile-damage: 0.5  # arrows and tridents do this share: no winning from a tower
  kill-heal: 0.08         # share of its health it drinks back when it kills a player
  lifesteal: 0.3          # in its last stand, share of the damage it deals that heals it
  regen: 0.01             # share of its health regained per second once nobody has hurt it for 15s
  thralls: 3              # Blood Thralls raised in its last stand (+1 per extra player); it takes half
                          # damage while any stand
  berserk-after: 480      # seconds of fighting before it goes berserk: 50% harder, faster (0 = never)
  bleed:
    stacks: 2             # bleed stacks each of its hits leaves (bleeding ignores armour)
    damage: 1.0           # per stack, every second
  animation-interval: 2   # ticks between model updates: 1 smoothest, 3 lightest on bandwidth
  atmosphere: true        # blood mist around players in the arena while it fights
  announce: true          # tell nearby players when it falls
  attacks:
    cooldown: 2.2         # seconds between special attacks (bloodied: 30% less, last stand: 50% less)
    cleave-damage: 28     # a wide sweep in front of it: get out of the arc, or behind a wall
    slam-damage: 24       # a shockwave along the ground: jump it, or put a wall between you
    spike-damage: 20      # eruptions under players, walls or not: step off the ring
    charge-damage: 24     # a shield charge along a telegraphed line: sidestep it
    leap-damage: 26       # it jumps to you and crashes down: get out of the circle
    grasp-damage: 10      # a blood tether drags you to it, then it hammers down: break line of sight
    rain-damage: 14       # bloodied: blood falls in marked circles, a roof stops it
    whirlwind-damage: 12  # last stand: three turns with the sword out, hitting everything close
  loot:
    cores-min: 3
    cores-max: 6
    armor-chance: 0.6     # chance of one Blood Knight armour piece
    experience: 1500

# ☠ The Bloodlands: a crimson plains world reached through Bloodstone portals. Its red grass,
# blood-red water and crimson fog come from a small datapack the plugin installs into your main
# world (Minecraft 1.21.11 only); the Bloodlands open after the server's next restart. See the
# README for what that means before you update Minecraft.
bloodlands:
  enabled: true
  world-name: Bloodlands
  seed: 0                 # 0 = derived from the main world's seed
  biome-datapack: true    # false: no datapack, the Bloodlands open at once with vanilla grass and sky
  freeze-time: true       # a sky that stays at dusk (monsters walk)
  time: 13800             # the time it's frozen at, in ticks (13000 = sunset, 18000 = midnight)
  lake-frequency: 1.0     # blood lakes: 0 = none, 2 = twice as many
  elite-chance: 0.08      # share of Bloodlands monsters that spawn Bloodbound (red armour, more health)
  elite-health: 40

# Bloodlands portals: a ring of Bloodstone Frames of any size, lit with flint and steel. Sizes are
# the inside of the frame, in blocks.
portal:
  minimum-width: 2
  maximum-width: 20
  minimum-height: 3
  maximum-height: 20
  warmup: 1.0             # seconds standing in a portal before it takes you
  cooldown: 5             # seconds before a player can use a portal again
  reclaim-inactive-frames: true   # sneak-mine an UNLIT frame block to take it back (lit ones never break)
  arrival-spread: 4       # arrivals land up to this far from the Bloodlands spawn, never on each other

# Any water in the Bloodlands is blood. Standing in it hurts and makes you bleed; leaving it stops it.
blood-water:
  enabled: true
  damage: 1.0             # every interval, on top of the bleeding
  interval: 1.0
  bleeding-duration: 5
  bleeding-stacks: 1

# Bloodbath's bleeding: from blood water, bled weapons (below). All run off one timer.
bleeding:
  damage: 0.5             # per stack, every interval (armour doesn't stop it)
  interval: 1.5
  duration: 5
  max-stacks: 5
  stacking: stack         # stack: stacks add up | refresh: the stronger stays | none: a running bleed is left alone
  particles: 2            # drops of blood per stack each interval (capped at 8)

# Blood Drops: the Blood Anvil's currency. Deliberately rare.
blood-drop:
  mob-drop-chance: 0.02   # any monster killed in the Bloodlands
  elite-drop-chance: 0.35 # a Bloodbound
  structure-chance: 0.6   # a ruined shrine's chest (1, sometimes 2)
  shrine-frequency: 1.0   # how often shrines appear (1 = about one in 280 chunks)
  boss-min: 1             # the Blood Knight
  boss-max: 3
  pickup-effects: true

blood-anvil:
  enabled: true
  craftable: true         # recipes.blood_anvil below

# Blood Levels: what each level adds to a weapon, and what it costs. Add or remove levels freely
# (1, 2, 3... in order). damage-bonus: melee damage (arrow damage for the bow). ability-power: extra
# share of the weapon's ability damage. bleeding-chance: chance a hit makes the target bleed.
blood-levels:
  1: {cost: 1, damage-bonus: 1.0, ability-power: 0.05, bleeding-chance: 0.04}
  2: {cost: 2, damage-bonus: 2.0, ability-power: 0.10, bleeding-chance: 0.08}
  3: {cost: 3, damage-bonus: 3.0, ability-power: 0.15, bleeding-chance: 0.12}
  4: {cost: 5, damage-bonus: 4.5, ability-power: 0.20, bleeding-chance: 0.16}
  5: {cost: 8, damage-bonus: 6.0, ability-power: 0.30, bleeding-chance: 0.22}

# Every Bloodbath sound can be made quieter, swapped or muted.
sounds:
  volume: 1.0
  # Swap a sound for another (or '' to mute it), by Minecraft sound id. For example:
  # replace:
  #   'entity.warden.sonic_boom': 'entity.generic.explode'
  #   'block.bell.use': ''
  replace: {}

# Crafting recipes. Every weapon and armour piece needs a Blood Core (BLOOD_CORE below), which
# the Blood Knight drops and which can be crafted from a nether star. Bloodbath items themselves
# can never be used as ingredients, and a Blood Core only works in these recipes.
recipes:
  enabled: true
  blood_core:
    shape: ['RTR', 'TNT', 'RTR']
    ingredients: {R: REDSTONE_BLOCK, T: GHAST_TEAR, N: NETHER_STAR}
  riftblade:
    shape: [' E ', 'RSR', 'PCP']
    ingredients: {E: ENDER_EYE, R: REDSTONE_BLOCK, S: NETHERITE_SWORD, P: ENDER_PEARL, C: BLOOD_CORE}
  bloodhook:
    shape: [' H ', 'RNR', 'LCL']
    ingredients: {H: TRIPWIRE_HOOK, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, L: LEAD, C: BLOOD_CORE}
  nullblade:
    shape: [' W ', 'RSR', 'FCF']
    ingredients: {W: WITHER_ROSE, R: REDSTONE_BLOCK, S: NETHERITE_SWORD, F: FERMENTED_SPIDER_EYE, C: BLOOD_CORE}
  meteor_gauntlet:
    shape: [' M ', 'RNR', 'FCF']
    ingredients: {M: MAGMA_BLOCK, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, F: FIRE_CHARGE, C: BLOOD_CORE}
  gravestone:
    shape: [' O ', 'RNR', 'DCD']
    ingredients: {O: CRYING_OBSIDIAN, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, D: SOUL_SAND, C: BLOOD_CORE}
  chronos:
    shape: [' K ', 'RNR', 'ECE']
    ingredients: {K: CLOCK, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, E: ECHO_SHARD, C: BLOOD_CORE}
  thunder_pike:
    shape: [' L ', 'RNR', 'BCB']
    ingredients: {L: LIGHTNING_ROD, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, B: BLAZE_ROD, C: BLOOD_CORE}
  mirrorfang:
    shape: [' G ', 'RNR', 'ACA']
    ingredients: {G: TINTED_GLASS, R: REDSTONE_BLOCK, N: NETHERITE_INGOT, A: AMETHYST_SHARD, C: BLOOD_CORE}
  void_scythe:
    shape: [' W ', 'RSR', 'BCB']
    ingredients: {W: WITHER_SKELETON_SKULL, R: REDSTONE_BLOCK, S: NETHERITE_SWORD, B: BONE_BLOCK, C: BLOOD_CORE}
  paradox_bow:
    shape: [' E ', 'RBR', 'NCN']
    ingredients: {E: ECHO_SHARD, R: REDSTONE_BLOCK, B: BOW, N: NETHERITE_INGOT, C: BLOOD_CORE}
  vampire_fang:
    shape: [' T ', 'RSR', 'ACA']
    ingredients: {T: GHAST_TEAR, R: REDSTONE_BLOCK, S: NETHERITE_SWORD, A: GOLDEN_APPLE, C: BLOOD_CORE}
  blood_grimoire:
    shape: [' N ', 'RBR', 'TCT']
    ingredients: {N: NETHERITE_INGOT, R: REDSTONE_BLOCK, B: BOOK, T: TOTEM_OF_UNDYING, C: BLOOD_CORE}
  blood_knight_helm:
    shape: [' W ', 'RHR', ' C ']
    ingredients: {W: WITHER_SKELETON_SKULL, R: REDSTONE_BLOCK, H: NETHERITE_HELMET, C: BLOOD_CORE}
  blood_knight_cuirass:
    shape: [' O ', 'RAR', ' C ']
    ingredients: {O: CRYING_OBSIDIAN, R: REDSTONE_BLOCK, A: NETHERITE_CHESTPLATE, C: BLOOD_CORE}
  blood_knight_greaves:
    shape: [' W ', 'RLR', ' C ']
    ingredients: {W: NETHER_WART_BLOCK, R: REDSTONE_BLOCK, L: NETHERITE_LEGGINGS, C: BLOOD_CORE}
  blood_knight_sabatons:
    shape: [' S ', 'RBR', ' C ']
    ingredients: {S: SOUL_SAND, R: REDSTONE_BLOCK, B: NETHERITE_BOOTS, C: BLOOD_CORE}
  blood_anvil:
    shape: ['NCN', ' A ', 'BBB']
    ingredients: {N: NETHERITE_INGOT, C: BLOOD_CORE, A: ANVIL, B: POLISHED_BLACKSTONE}
  bloodstone_frame:   # makes 8
    shape: ['BOB', 'OCO', 'BOB']
    ingredients: {B: POLISHED_BLACKSTONE_BRICKS, O: CRYING_OBSIDIAN, C: BLOOD_CORE}
